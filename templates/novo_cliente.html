{% extends "base.html" %}
{% block title %}Novo Cliente{% endblock %}
{% block topbar_title %}Cadastrar Cliente{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-3">
  <a href="{{ url_for('clientes') }}" class="text-muted text-decoration-none me-3">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h4 class="fw-bold mb-0">Novo Cliente</h4>
</div>

<div class="card" style="max-width:700px">
  <div class="card-body p-4">
    <form method="post">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label fw-semibold">Nome completo <span class="text-danger">*</span></label>
          <input type="text" name="nome" class="form-control" value="{{ form.get('nome','') }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">CPF</label>
          <input type="text" name="cpf" class="form-control" value="{{ form.get('cpf','') }}" placeholder="000.000.000-00">
        </div>
        <div class="col-md-6">
          <label class="form-label">Data de Nascimento</label>
          <input type="date" name="nascimento" class="form-control" value="{{ form.get('nascimento','') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Celular / WhatsApp</label>
          <input type="text" name="celular" class="form-control" value="{{ form.get('celular','') }}" placeholder="(83) 99999-9999">
        </div>
        <div class="col-md-6">
          <label class="form-label">Telefone</label>
          <input type="text" name="telefone" class="form-control" value="{{ form.get('telefone','') }}">
        </div>
        <div class="col-12">
          <label class="form-label">E-mail</label>
          <input type="email" name="email" class="form-control" value="{{ form.get('email','') }}">
        </div>
        <div class="col-12">
          <label class="form-label">Endereço</label>
          <input type="text" name="endereco" class="form-control" value="{{ form.get('endereco','') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Cidade</label>
          <input type="text" name="cidade" class="form-control" value="{{ form.get('cidade','') }}">
        </div>
        <div class="col-12">
          <label class="form-label">Observações</label>
          <textarea name="observacao" class="form-control" rows="3">{{ form.get('observacao','') }}</textarea>
        </div>
        <div class="col-12 d-flex gap-2 pt-2">
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-lg me-1"></i>Cadastrar
          </button>
          <a href="{{ url_for('clientes') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
