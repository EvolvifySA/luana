{% extends "base.html" %}
{% block title %}Novo Animal{% endblock %}
{% block topbar_title %}Cadastrar Animal{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-3">
  <a href="{{ url_for('cliente', id_cliente=id_cliente) }}" class="text-muted text-decoration-none me-3">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h4 class="fw-bold mb-0">
    Novo Animal
    {% if cliente %}
      <small class="text-muted fw-normal">— {{ cliente.get('nome') or cliente.get('Nome','') }}</small>
    {% endif %}
  </h4>
</div>

<div class="card" style="max-width:600px">
  <div class="card-body p-4">
    <form method="post">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label fw-semibold">Nome do Animal <span class="text-danger">*</span></label>
          <input type="text" name="nome" class="form-control" value="{{ form.get('nome','') }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Espécie</label>
          <select name="especie" class="form-select">
            <option value="">Selecionar...</option>
            <option value="Canina" {% if form.get('especie')=='Canina' %}selected{% endif %}>Canina</option>
            <option value="Felina" {% if form.get('especie')=='Felina' %}selected{% endif %}>Felina</option>
            <option value="Ave" {% if form.get('especie')=='Ave' %}selected{% endif %}>Ave</option>
            <option value="Roedor" {% if form.get('especie')=='Roedor' %}selected{% endif %}>Roedor</option>
            <option value="Outro" {% if form.get('especie')=='Outro' %}selected{% endif %}>Outro</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Sexo</label>
          <select name="sexo" class="form-select">
            <option value="">Selecionar...</option>
            <option value="Macho" {% if form.get('sexo')=='Macho' %}selected{% endif %}>Macho</option>
            <option value="Fêmea" {% if form.get('sexo')=='Fêmea' %}selected{% endif %}>Fêmea</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Raça</label>
          <input type="text" name="raca" class="form-control" value="{{ form.get('raca','') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Pelagem / Cor</label>
          <input type="text" name="pelagem" class="form-control" value="{{ form.get('pelagem','') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Data de Nascimento</label>
          <input type="date" name="nascimento" class="form-control" value="{{ form.get('nascimento','') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Nº do Chip</label>
          <input type="text" name="chip" class="form-control" value="{{ form.get('chip','') }}">
        </div>
        <div class="col-12">
          <label class="form-label">Observações</label>
          <textarea name="observacao" class="form-control" rows="3">{{ form.get('observacao','') }}</textarea>
        </div>
        <div class="col-12 d-flex gap-2 pt-2">
          <button type="submit" class="btn btn-success px-4">
            <i class="bi bi-check-lg me-1"></i>Cadastrar
          </button>
          <a href="{{ url_for('cliente', id_cliente=id_cliente) }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
